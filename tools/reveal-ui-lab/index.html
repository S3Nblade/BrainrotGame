<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Egg Mutation Reveal</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="lab-shell">
      <section class="controls" aria-label="Reveal controls">
        <div>
          <p class="eyebrow">Reveal UI Lab</p>
          <h1>Egg Mutation Reveal</h1>
        </div>
        <label>
          Mutation
          <select id="mutation">
            <option selected>Diamond</option>
            <option>Radioactive</option>
            <option>Gold</option>
            <option>Rainbow</option>
            <option>Shadow</option>
            <option>Normal</option>
          </select>
        </label>
        <button id="playButton" type="button">Play reveal</button>
      </section>

      <section class="preview-wrap" aria-label="Reveal preview">
        <div id="reveal" class="reveal">
          <div class="stage">
            <img class="soft-glow" src="../../generated_assets/reveal_gui/soft_glow.png" alt="" />
            <div class="egg">
              <div class="egg-half egg-top">
                <div class="egg-highlight"></div>
              </div>
              <div class="egg-half egg-bottom"></div>
              <span class="crack crack-a"></span>
              <span class="crack crack-b"></span>
              <span class="crack crack-c"></span>
              <span class="crack crack-d"></span>
            </div>
            <div class="crack-flash"></div>
            <div class="sparkles" aria-hidden="true"></div>
            <p class="mutation-label">Diamond Mutation</p>
          </div>
        </div>
      </section>
    </main>

    <script src="reveal.js"></script>
  </body>
</html>
