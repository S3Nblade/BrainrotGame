<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NPC Reveal UI Lab</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="lab-shell">
      <section class="controls" aria-label="Reveal controls">
        <div>
          <p class="eyebrow">Reveal UI Lab</p>
          <h1>Egg NPC Reveal</h1>
        </div>
        <label>
          NPC name
          <input id="npcName" value="Brr Brr Patapim" />
        </label>
        <label>
          Rarity
          <select id="rarity">
            <option>Common</option>
            <option>Rare</option>
            <option>Epic</option>
            <option selected>Legendary</option>
            <option>Mythic</option>
            <option>Secret</option>
            <option>Huge</option>
          </select>
        </label>
        <label>
          Mutation
          <select id="mutation">
            <option selected>Diamond</option>
            <option>Radioactive</option>
            <option>Gold</option>
            <option>Rainbow</option>
            <option>Shadow</option>
            <option>Normal</option>
          </select>
        </label>
        <label>
          NPC image URL
          <input id="npcImage" placeholder="Optional image URL" />
        </label>
        <label class="check-row">
          <input id="isNew" type="checkbox" checked />
          NEW badge
        </label>
        <button id="playButton" type="button">Play reveal</button>
      </section>

      <section class="preview-wrap" aria-label="Reveal preview">
        <div id="reveal" class="reveal" data-rarity="Legendary">
          <div class="stage">
            <img class="soft-glow" src="../../generated_assets/reveal_gui/soft_glow.png" alt="" />
            <img class="burst-ring" src="../../generated_assets/reveal_gui/burst_ring.png" alt="" />
            <div class="egg">
              <div class="egg-half egg-top">
                <div class="egg-highlight"></div>
              </div>
              <div class="egg-half egg-bottom"></div>
              <span class="crack crack-a"></span>
              <span class="crack crack-b"></span>
              <span class="crack crack-c"></span>
              <span class="crack crack-d"></span>
            </div>
            <div class="crack-flash"></div>
            <div class="sparkles" aria-hidden="true"></div>
            <div class="npc-preview">
              <img class="npc-image" alt="" />
              <div class="npc-head">:)</div>
              <div class="npc-body"></div>
            </div>
            <h2 class="npc-name">Brr Brr Patapim</h2>
            <p class="mutation-label">Diamond Mutation</p>
            <img class="new-badge-img" src="../../generated_assets/reveal_gui/new_badge.png" alt="" />
            <p class="new-badge-text">NEW!</p>
            <img class="tap-panel-img" src="../../generated_assets/reveal_gui/tap_panel.png" alt="" />
            <p class="tap-text">Tap to continue</p>
          </div>
        </div>
      </section>
    </main>

    <script src="reveal.js"></script>
  </body>
</html>
